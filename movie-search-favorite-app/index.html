<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSearch - Movie Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>🎬 CineSearch</h1>
    
    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search for movies (e.g., Batman, Matrix)..." autocomplete="off">
      <button id="search-btn">Search</button>
    </div>

    <!-- Movies Grid Container -->
    <div id="movies-container" class="movies-grid">
      <!-- Movie cards will be injected dynamically via JavaScript -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
