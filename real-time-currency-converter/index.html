<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="converter-container">
    <h1>Currency Converter</h1>

    <div class="input-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any">
    </div>

    <div class="currency-row">
      <div class="input-group">
        <label for="from-currency">From</label>
        <select id="from-currency">
          <option value="USD" selected>USD - US Dollar</option>
          <option value="EUR">EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="JPY">JPY - Japanese Yen</option>
          <option value="CAD">CAD - Canadian Dollar</option>
        </select>
      </div>

      <div class="input-group">
        <label for="to-currency">To</label>
        <select id="to-currency">
          <option value="USD">USD - US Dollar</option>
          <option value="EUR" selected>EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="JPY">JPY - Japanese Yen</option>
          <option value="CAD">CAD - Canadian Dollar</option>
          <option value="GHS">GHS - Ghanaian cedis</option>
        </select>
      </div>
    </div>

    <button id="convert-btn">Convert Currency</button>

    <div id="result" class="result-box">
      <!-- Converted rate output appears here -->
      Enter an amount and click convert.
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
